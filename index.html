  <body class="ani">
    <!-- 기존 코드 -->
    <article class="bg">
      <div class="phone">
        <div class="top">
          <div></div>
          <span class="ic"> signal_cellular_alt </span>
          LTE
          <span class="ic"> battery_android_frame_full </span>
        </div>
      </div>
      <div class="bg-con">
        <h1>WEATHER MOOD</h1>
        <div class="object">
          <div class="tool">
            <h2>Tool & Skill Stack</h2>
            <ul>
              <li>
                <img src="./image/bg/figma.png" alt="figma" />
                <p>Figma</p>
              </li>
              <li>
                <img src="./image/bg/VS.png" alt="vs" />
                <p>VScode</p>
              </li>
            </ul>
            <div>
              <span>Ps</span>
              <span>Ai</span>
              <span>🍌</span><br />
              <span>JavaScript</span>
              <span>Swiper.js</span>
              <span>OpenAPI</span>
            </div>
          </div>
          <p>
            <img src="./image/bg/BG-wendy.png" alt="wendy" />
            <img src="./image/bg/BG-Nardy.png" alt="nardy" />
          </p>
          <div class="talk">
            <p>오늘 <span>뭐 입지?</span></p>
            <p>밖에서 <span>운동해도</span> 될까?</p>
            <p>오늘 날씨에 <span>어울리는 노래</span>는 뭘까?</p>
          </div>
        </div>
      </div>
      <div class="app">
        <div class="appLoading">
          <div class="loadingSpinner"></div>
          <p>Loading...</p>
        </div>
        <div class="main">
          <!-- =============================메인 현재날씨===================== -->
          <section class="mainHeader">
            <div class="mainCurrentWeather">
              <h3 id="currentTempIndex"></h3>
              <p><b id="weatherState"></b> <b id="minMaxTempIndex"></b></p>
              <p></p>
            </div>
            <div class="mainSetting">
              <span class="material-symbols-outlined" style="cursor: pointer">
                settings
              </span>
            </div>
          </section>

          <!-- ============================중간컨텐츠========================== -->
          <section>
            <div class="contents">
              <div class="weather">
                <!-- 비 -->
                <div class="rain">
                  <img
                    src="./image/index/weather/weather_cloud.png"
                    class="cloud"
                  />
                  <div class="rain_drop-container"></div>
                </div>

                <!-- 비/눈 -->
                <div>
                  <img
                    src="./image/index/weather/weather_cloud.png"
                    class="cloud"
                  />
                  <div class="rainSnow_drop-container"></div>
                </div>

                <!-- 눈 -->
                <div>
                  <img
                    src="./image/index/weather/weather_cloud.png"
                    class="snow"
                  />
                  <img
                    src="./image/index/weather/weather_snow.png"
                    class="snow1"
                  />
                  <img
                    src="./image/index/weather/weather_snow.png"
                    class="snow2"
                  />
                  <img
                    src="./image/index/weather/weather_snow.png"
                    class="snow3"
                  />
                  <img
                    src="./image/index/weather/weather_snow.png"
                    class="snow4"
                  />
                </div>

                <!-- 맑음 -->
                <div class="weatherSun">
                  <img src="./image/index/weather/weather_sun.png" />
                </div>

                <!-- 구름(살짝흐림) -->
                <div class="cloudy">
                  <img
                    class="cloud2"
                    src="./image/index/weather/weather_cloud.png"
                  />
                  <img
                    class="cloudSun"
                    src="./image/index/weather/weather_sun.png"
                  />
                </div>

                <!-- 흐림 -->
                <div>
                  <img
                    src="./image/index/weather/weather_cloud.png"
                    class="cloud cloud-front"
                  />
                  <img
                    src="./image/index/weather/weather_cloud.png"
                    class="cloud cloud-back"
                  />
                </div>
              </div>
              <p class="character">
                <!-- <img src="./image/index/누끼최종/Nardy_5-8.png" alt=""> -->
